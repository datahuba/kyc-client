name: Deploy Frontend to VPS

on:
  push:
    branches:
      - develop_kevin

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Sincronización y Reconstrucción Absoluta
        uses: appleboy/ssh-action@v1.0.3
        with:
          # F-ACTIONS-FIX (2026-07-21): migrado a SSH key (mismo patrón que backend).
          # VPS endurecido: no acepta password, puerto 22 cerrado, user root bloqueado.
          host: ${{ secrets.VPS_SSH_HOST }}
          port: 2222
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            # F-ACTIONS-FRONTEND-DEPLOY-UNIFIED (2026-07-30): el workflow del
            # frontend antes tenia su propio script inline con un bug donde
            # el lock /tmp/deploy-frontend.lock quedaba huerfano cuando el
            # deploy fallaba (ej. container name conflict). Esto bloqueaba
            # todos los deploys futuros hasta que alguien limpiara el lock
            # manualmente.
            #
            # Solucion: mismo patron que el backend. Un script unificado
            # /usr/local/bin/kyc-deploy-frontend con:
            #   - Auto-cleanup de locks huerfanos (>10 min)
            #   - Pre-cleanup de container zombie (evita el "name conflict")
            #   - Lock con flock + timeout 15 min
            #   - Log persistente en /tmp/deploy-frontend.log
            #   - Health check al final
            #   - Cleanup de imagenes huerfanas
            # El script esta en el repo (scripts/kyc-deploy-frontend.sh)
            # y se instala idempotentemente en cada deploy.
            sudo -n bash -c '
              set -e
              # Instalar el script si no existe o si es mas viejo que el del repo
              REPO_SCRIPT="/root/postgrado/frontend/scripts/kyc-deploy-frontend.sh"
              INSTALLED_SCRIPT="/usr/local/bin/kyc-deploy-frontend"
              if [[ ! -f "$INSTALLED_SCRIPT" ]] || [[ "$REPO_SCRIPT" -nt "$INSTALLED_SCRIPT" ]]; then
                install -m 0755 "$REPO_SCRIPT" "$INSTALLED_SCRIPT"
                echo "kyc-deploy-frontend instalado/actualizado en /usr/local/bin/"
              fi

              # Log de quien disparo el deploy (util para auditoria)
              echo "=== DEPLOY disparado por GitHub Actions ===" >> /tmp/deploy-frontend.log
              echo "    triggered_by=github-actions sha=$(git -C /root/postgrado/frontend rev-parse origin/develop_kevin 2>/dev/null || echo unknown)" >> /tmp/deploy-frontend.log

              # Ejecutar el deploy unificado. El script maneja:
              # - auto-cleanup de locks huerfanos
              # - pre-cleanup de container zombie (evita el "name conflict")
              # - lock con flock + timeout 15 min
              # - log persistente
              # - health check post-deploy
              # - cleanup de imagenes huerfanas
              /usr/local/bin/kyc-deploy-frontend
            '
